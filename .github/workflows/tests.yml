name: Django Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Django tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: handmade_marketplace_test_db
          POSTGRES_USER: marketplace_user
          POSTGRES_PASSWORD: marketplace_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U marketplace_user -d handmade_marketplace_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: django-insecure-ci-secret-key
      DEBUG: True
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_URL: postgres://marketplace_user:marketplace_password@localhost:5432/handmade_marketplace_test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test