services:
  db:
    image: postgres:17-alpine
    container_name: handmade_marketplace_db
    environment:
      POSTGRES_DB: handmade_marketplace_db
      POSTGRES_USER: marketplace_user
      POSTGRES_PASSWORD: marketplace_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace_user -d handmade_marketplace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: handmade_marketplace_backend
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data: